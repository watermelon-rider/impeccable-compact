<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harbor Desk</title>
  <style>
    :root { --ink: #171512; --paper: #f4efe6; --accent: #b43a24; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Arial, sans-serif; }
    main { max-width: 72rem; margin: 4rem auto; padding: 0 1.5rem; }
    h1 { max-width: 18ch; font-size: clamp(2.5rem, 7vw, 5rem); line-height: .95; }
    .action { display: inline-block; background: var(--accent); color: var(--paper); padding: .75rem 1rem; }
  </style>
</head>
<body>
  <main>
    <p>Exception queue</p>
    <h1>Recover the shipment before the dock deadline.</h1>
    <a class="action" href="#queue">Review late freight</a>
  </main>
</body>
</html>
